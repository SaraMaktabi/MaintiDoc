    "llama-index-llms-ollama>=0.11.0",
    "llama-index-vector-stores-chroma>=0.6.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
